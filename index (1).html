<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Bird: Зомби</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0; height: 100%; background: #70c5ce; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  'use strict';

  // ================= Telegram =================
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    } catch (e) {}
  }
  function haptic(type) { try { tg.HapticFeedback.impactOccurred(type); } catch (e) {} }
  function hapticNotify(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }

  // ================= Холст =================
  var W = 360, H = 640;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scale = 1;

  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ================= Настройки баланса (можно менять) =================
  var GROUND_H = 80;
  var GRAVITY = 1500;       // px/s^2
  var FLAP_V = -430;        // скорость прыжка
  var PIPE_W = 60;
  var PIPE_SPACING = 210;   // расстояние между трубами
  var BIRD_X = 90;
  var BIRD_R = 13;
  var LEVEL_STEP = 6;       // сколько труб нужно пройти для нового уровня
  var LEVEL_BONUS = 5;      // монет за новый уровень
  var ATTACK_CD = 0.45;     // перезарядка атаки, сек
  var SHOT_SPEED = 480;     // скорость выстрела

  function pipeSpeed() { return Math.min(130 + (level - 1) * 9, 215); }
  function pipeGap() { return Math.max(128, 165 - (level - 1) * 4); }

  // Кнопка атаки и прочие кнопки (в координатах 360x640)
  var ATK = { x: W - 50, y: H - 42, r: 34 };
  var BTN_SHOP = { x: 95, y: 430, w: 170, h: 46 };
  var BTN_SOUND = { x: W - 46, y: 10, w: 34, h: 34 };
  var BTN_PLAY = { x: 70, y: 360, w: 220, h: 44 };
  var BTN_DSHOP = { x: 70, y: 414, w: 220, h: 44 };
  var BTN_BACK = { x: 110, y: 580, w: 140, h: 42 };

  // ================= Скины =================
  var SKINS = [
    { id: 'classic', name: 'Классика', price: 0,   body: '#f7d51d', wing: '#f0b800', line: '#8a6d00', beak: '#f26b1d' },
    { id: 'red',     name: 'Красная',  price: 15,  body: '#ee4b4b', wing: '#c42d2d', line: '#6b1111', beak: '#ffb02e' },
    { id: 'blue',    name: 'Синяя',    price: 15,  body: '#4aa3ff', wing: '#2b7dd6', line: '#16406e', beak: '#ffb02e' },
    { id: 'green',   name: 'Зелёная',  price: 25,  body: '#58d26b', wing: '#35a84a', line: '#1c5a28', beak: '#f26b1d' },
    { id: 'pink',    name: 'Розовая',  price: 25,  body: '#ff8fc7', wing: '#ee5fa6', line: '#7a2552', beak: '#ffd04a', extra: 'bow' },
    { id: 'ninja',   name: 'Ниндзя',   price: 60,  body: '#3a3f4a', wing: '#23262d', line: '#000000', beak: '#f26b1d', extra: 'band' },
    { id: 'gold',    name: 'Король',   price: 120, body: '#ffd23f', wing: '#e0a800', line: '#7a5a00', beak: '#ff7a1d', extra: 'crown' },
    { id: 'rainbow', name: 'Радужная', price: 200, rainbow: true, line: '#222222', beak: '#ffffff' }
  ];
  function getSkin(id) {
    for (var i = 0; i < SKINS.length; i++) if (SKINS[i].id === id) return SKINS[i];
    return SKINS[0];
  }

  // ================= Сохранение =================
  var save = { best: 0, bestLevel: 1, coins: 0, skin: 'classic', owned: ['classic'], muted: false };
  function load() {
    try {
      var raw = localStorage.getItem('flappy_save_v2');
      if (raw) {
        var o = JSON.parse(raw);
        if (typeof o.best === 'number') save.best = o.best;
        if (typeof o.bestLevel === 'number') save.bestLevel = o.bestLevel;
        if (typeof o.coins === 'number') save.coins = o.coins;
        if (typeof o.skin === 'string') save.skin = o.skin;
        if (Array.isArray(o.owned)) save.owned = o.owned;
        if (typeof o.muted === 'boolean') save.muted = o.muted;
      } else {
        var old = parseInt(localStorage.getItem('flappy_best') || '0', 10);
        if (old > 0) save.best = old; // рекорд из старой версии
      }
    } catch (e) {}
    if (save.owned.indexOf('classic') < 0) save.owned.push('classic');
    if (save.owned.indexOf(save.skin) < 0) save.skin = 'classic';
  }
  function persist() {
    try { localStorage.setItem('flappy_save_v2', JSON.stringify(save)); } catch (e) {}
  }
  load();
  document.addEventListener('visibilitychange', function () { if (document.hidden) persist(); });

  // ================= Звук =================
  var actx = null;
  function ensureAudio() {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) actx = new AC();
      }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function beep(f1, f2, dur, type, vol, delay) {
    if (save.muted || !actx) return;
    try {
      var t0 = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t0 + dur);
      g.gain.setValueAtTime(vol || 0.04, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  var sfx = {
    flap:  function () { beep(380, 620, 0.09, 'square', 0.03); },
    coin:  function () { beep(880, 880, 0.07, 'square', 0.035); beep(1320, 1320, 0.1, 'square', 0.035, 0.07); },
    shoot: function () { beep(700, 200, 0.14, 'sawtooth', 0.035); },
    kill:  function () { beep(220, 70, 0.22, 'sawtooth', 0.05); },
    hit:   function () { beep(300, 150, 0.08, 'square', 0.04); },
    die:   function () { beep(300, 60, 0.45, 'sawtooth', 0.06); },
    level: function () { beep(523, 523, 0.1, 'square', 0.04); beep(659, 659, 0.1, 'square', 0.04, 0.1); beep(784, 784, 0.18, 'square', 0.04, 0.2); },
    buy:   function () { beep(660, 660, 0.08, 'square', 0.04); beep(990, 990, 0.14, 'square', 0.04, 0.08); },
    deny:  function () { beep(160, 120, 0.18, 'square', 0.04); }
  };

  // ================= Состояние игры =================
  var state = 'ready';      // ready | playing | dead | shop
  var bird, pipes, items, enemies, shots, parts, pops, clouds;
  var score = 0, level = 1, runCoins = 0, runKills = 0, newBest = false;
  var groundX = 0, deadTime = 0, spawnTimer = 0, attackCd = 0, shake = 0, gt = 0;
  var banner = null, toast = null;

  function reset() {
    bird = { y: H / 2 - 40, vy: 0, rot: 0 };
    pipes = []; items = []; enemies = []; shots = []; parts = []; pops = [];
    score = 0; level = 1; runCoins = 0; runKills = 0; newBest = false;
    groundX = 0; attackCd = 0; shake = 0; banner = null;
    if (!clouds) {
      clouds = [];
      for (var i = 0; i < 4; i++) {
        clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 200, s: 0.6 + Math.random() * 0.8 });
      }
    }
    state = 'ready';
  }

  function startRun() {
    state = 'playing';
    addPipe(W + 40);
    spawnTimer = 3.2;
  }

  // ---------- Создание объектов ----------
  function addPipe(x) {
    var gap = pipeGap();
    var min = 90, max = H - GROUND_H - gap - 90;
    var gy = min + Math.random() * (max - min);
    var prev = pipes[pipes.length - 1];
    // монета в проходе
    if (Math.random() < 0.85) {
      var off = (Math.random() - 0.5) * (gap - 50);
      items.push({ x: x + PIPE_W / 2, y: gy + gap / 2 + off, spin: Math.random() * 6 });
    }
    // монета между трубами
    if (prev && Math.random() < 0.6) {
      items.push({
        x: x - PIPE_SPACING / 2 + PIPE_W / 2,
        y: (prev.gapY + prev.gap / 2 + gy + gap / 2) / 2,
        spin: Math.random() * 6
      });
    }
    pipes.push({ x: x, gapY: gy, gap: gap, passed: false });
  }

  function spawnEnemy() {
    var tough = level >= 3 && Math.random() < Math.min(0.55, 0.2 + 0.04 * level);
    var minY = 70, maxY = H - GROUND_H - 60;
    var y = minY + Math.random() * (maxY - minY);
    if (level >= 2 && Math.random() < 0.5) {
      y = Math.max(minY, Math.min(maxY, bird.y + (Math.random() - 0.5) * 80));
    }
    enemies.push({
      x: W + 40, baseY: y, y: y, t: 0,
      ph: Math.random() * 6, freq: 2 + Math.random() * 2,
      amp: 6 + Math.random() * Math.min(8 + level * 2, 30),
      speed: pipeSpeed() + 60 + Math.random() * 30 + Math.min(level * 3, 30),
      r: tough ? 18 : 14, hp: tough ? 2 : 1, tough: tough, flash: 0, reward: tough ? 3 : 1
    });
    spawnTimer = Math.max(1.5, 4.6 - level * 0.35) + Math.random() * 1.2;
  }

  // ---------- Эффекты ----------
  function burst(x, y, color, n, spd) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = (0.3 + Math.random()) * (spd || 160);
      var life = 0.5 + Math.random() * 0.4;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: life, max: life, color: color, size: 2 + Math.random() * 3 });
    }
  }
  function popup(x, y, text, color, size) {
    pops.push({ x: x, y: y, text: text, color: color || '#ffd84a', size: size || 18, life: 0.9 });
  }

  // ---------- Действия игрока ----------
  function flap() {
    if (state !== 'playing') return;
    bird.vy = FLAP_V;
    sfx.flap();
    haptic('light');
  }

  function attack() {
    if (state !== 'playing' || attackCd > 0) return;
    attackCd = ATTACK_CD;
    shots.push({ x: BIRD_X + 18, y: bird.y, r: 7 });
    sfx.shoot();
    haptic('medium');
  }

  function collectCoin(c) {
    save.coins += 1; runCoins += 1;
    sfx.coin();
    burst(c.x, c.y, '#ffd84a', 6, 110);
    popup(c.x, c.y - 10, '+1');
    persist();
  }

  function killEnemy(e) {
    save.coins += e.reward; runCoins += e.reward; runKills++;
    sfx.kill();
    haptic('heavy');
    burst(e.x, e.y, e.tough ? '#9b7fd1' : '#9fd18a', 16, 190);
    burst(e.x, e.y, '#f4efe0', 4, 140);
    popup(e.x, e.y - 14, '+' + e.reward, '#ffd84a', 22);
    persist();
  }

  function checkLevel() {
    var nl = 1 + Math.floor(score / LEVEL_STEP);
    if (nl > level) {
      level = nl;
      save.coins += LEVEL_BONUS; runCoins += LEVEL_BONUS;
      if (level > save.bestLevel) save.bestLevel = level;
      banner = { t: 1.8, text: 'УРОВЕНЬ ' + level, sub: '+' + LEVEL_BONUS + ' монет' };
      sfx.level();
      hapticNotify('success');
      burst(W / 2, 210, '#ffd84a', 26, 220);
      persist();
    }
  }

  function die() {
    state = 'dead';
    deadTime = performance.now();
    shake = 10;
    sfx.die();
    hapticNotify('error');
    burst(BIRD_X, bird.y, getSkin(save.skin).body || '#fff', 14, 170);
    if (score > save.best) { save.best = score; newBest = true; }
    if (level > save.bestLevel) save.bestLevel = level;
    persist();
  }

  // ================= Магазин =================
  function openShop() { state = 'shop'; toast = null; }
  function cardRect(i) {
    var col = i % 2, row = Math.floor(i / 2);
    return { x: 22 + col * 166, y: 108 + row * 112, w: 150, h: 104 };
  }
  function showToast(text, color) { toast = { t: 1.4, text: text, color: color || '#fff' }; }

  function onShopPress(x, y) {
    if (inRect(x, y, BTN_BACK)) { reset(); return; }
    for (var i = 0; i < SKINS.length; i++) {
      if (!inRect(x, y, cardRect(i))) continue;
      var s = SKINS[i];
      if (save.owned.indexOf(s.id) >= 0) {
        save.skin = s.id;
        sfx.coin();
        persist();
      } else if (save.coins >= s.price) {
        save.coins -= s.price;
        save.owned.push(s.id);
        save.skin = s.id;
        sfx.buy();
        hapticNotify('success');
        showToast('Куплено: ' + s.name + '!', '#9dff9d');
        persist();
      } else {
        sfx.deny();
        hapticNotify('error');
        showToast('Не хватает монет: нужно ещё ' + (s.price - save.coins), '#ff9d9d');
      }
      return;
    }
  }

  // ================= Ввод =================
  function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
  function toLogical(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }

  function onPress(x, y) {
    if (state === 'ready') {
      if (inRect(x, y, BTN_SHOP)) { openShop(); return; }
      if (inRect(x, y, BTN_SOUND)) { save.muted = !save.muted; persist(); return; }
      startRun(); flap();
    } else if (state === 'playing') {
      var dx = x - ATK.x, dy = y - ATK.y;
      if (dx * dx + dy * dy <= (ATK.r + 10) * (ATK.r + 10)) { attack(); return; }
      flap();
    } else if (state === 'dead') {
      if (performance.now() - deadTime < 400) return;
      if (inRect(x, y, BTN_PLAY)) { reset(); return; }
      if (inRect(x, y, BTN_DSHOP)) { openShop(); return; }
    } else if (state === 'shop') {
      onShopPress(x, y);
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    var p = toLogical(e);
    onPress(p.x, p.y);
  });

  window.addEventListener('keydown', function (e) {
    var c = e.code;
    if (c === 'Space' || c === 'ArrowUp') {
      e.preventDefault();
      ensureAudio();
      if (state === 'ready') { startRun(); flap(); }
      else if (state === 'playing') flap();
      else if (state === 'dead' && performance.now() - deadTime > 400) reset();
    } else if (c === 'KeyF' || c === 'KeyX' || c === 'KeyZ' || c === 'Enter' || c === 'ShiftLeft') {
      e.preventDefault();
      attack();
    } else if (c === 'Escape' && state === 'shop') {
      reset();
    }
  });

  // ================= Логика =================
  function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = Math.max(rx, Math.min(cx, rx + rw));
    var ny = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function updateFx(dt) {
    parts.forEach(function (p) {
      p.life -= dt; p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    });
    parts = parts.filter(function (p) { return p.life > 0; });
    pops.forEach(function (p) { p.life -= dt; p.y -= 40 * dt; });
    pops = pops.filter(function (p) { return p.life > 0; });
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
    if (shake > 0) shake = Math.max(0, shake - 40 * dt);
  }

  function update(dt) {
    gt += dt;
    clouds.forEach(function (c) {
      c.x -= 10 * c.s * dt;
      if (c.x < -80) { c.x = W + 20; c.y = 40 + Math.random() * 200; }
    });
    updateFx(dt);
    if (attackCd > 0) attackCd = Math.max(0, attackCd - dt);

    if (state === 'ready') {
      bird.y = H / 2 - 40 + Math.sin(gt * 5) * 8;
      bird.rot = 0;
      groundX = (groundX - 130 * dt) % 24;
      return;
    }
    if (state === 'shop') return;

    if (state === 'dead') {
      bird.vy += GRAVITY * dt;
      bird.y = Math.min(bird.y + bird.vy * dt, H - GROUND_H - BIRD_R);
      bird.rot = Math.max(-0.5, Math.min(1.3, bird.vy / 500));
      return;
    }

    // ---------- playing ----------
    var spd = pipeSpeed();
    groundX = (groundX - spd * dt) % 24;
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.5, Math.min(1.3, bird.vy / 500));

    // трубы
    pipes.forEach(function (p) { p.x -= spd * dt; });
    var last = pipes[pipes.length - 1];
    if (last && last.x < W - PIPE_SPACING + PIPE_W) addPipe(last.x + PIPE_SPACING);
    pipes = pipes.filter(function (p) { return p.x + PIPE_W > -10; });

    // монеты
    items.forEach(function (c) { c.x -= spd * dt; });
    var keep = [];
    for (var ci = 0; ci < items.length; ci++) {
      var c = items[ci];
      var dx = c.x - BIRD_X, dy = c.y - bird.y;
      if (dx * dx + dy * dy < 26 * 26) { collectCoin(c); continue; }
      if (c.x > -20) keep.push(c);
    }
    items = keep;

    // столкновения с трубами и очки
    for (var i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      if (!p.passed && p.x + PIPE_W < BIRD_X - BIRD_R) {
        p.passed = true;
        score++;
        haptic('soft');
        checkLevel();
      }
      if (circleHitsRect(BIRD_X, bird.y, BIRD_R - 1, p.x, 0, PIPE_W, p.gapY) ||
          circleHitsRect(BIRD_X, bird.y, BIRD_R - 1, p.x, p.gapY + p.gap, PIPE_W, H)) {
        die();
        return;
      }
    }
    if (bird.y + BIRD_R >= H - GROUND_H) { bird.y = H - GROUND_H - BIRD_R; die(); return; }
    if (bird.y - BIRD_R < 0) { bird.y = BIRD_R; bird.vy = 0; }

    // зомби-птицы
    spawnTimer -= dt;
    if (spawnTimer <= 0) spawnEnemy();
    enemies.forEach(function (e) {
      e.t += dt;
      e.x -= e.speed * dt;
      e.y = e.baseY + Math.sin(e.t * e.freq + e.ph) * e.amp;
      if (e.flash > 0) e.flash = Math.max(0, e.flash - dt);
    });

    // выстрелы
    shots.forEach(function (s) { s.x += SHOT_SPEED * dt; });
    shots.forEach(function (s) {
      for (var k = 0; k < enemies.length; k++) {
        var e = enemies[k];
        if (e.hp <= 0) continue;
        var ex = e.x - s.x, ey = e.y - s.y;
        if (ex * ex + ey * ey < (e.r + s.r) * (e.r + s.r)) {
          s.dead = true;
          e.hp -= 1;
          e.flash = 0.12;
          if (e.hp <= 0) killEnemy(e);
          else { sfx.hit(); burst(s.x, s.y, '#f4efe0', 5, 120); }
          break;
        }
      }
    });
    shots = shots.filter(function (s) { return !s.dead && s.x < W + 20; });
    enemies = enemies.filter(function (e) { return e.hp > 0 && e.x > -40; });

    // столкновение птицы с зомби
    for (var j = 0; j < enemies.length; j++) {
      var en = enemies[j];
      var hx = en.x - BIRD_X, hy = en.y - bird.y;
      var rr2 = en.r * 0.8 + BIRD_R * 0.8;
      if (hx * hx + hy * hy < rr2 * rr2) { die(); return; }
    }
  }

  // ================= Отрисовка: вспомогательное =================
  var FONT = '"Trebuchet MS", Arial, sans-serif';

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function text(str, x, y, size, color, align, lw) {
    ctx.font = 'bold ' + size + 'px ' + FONT;
    ctx.textAlign = align || 'center';
    ctx.lineWidth = lw || Math.max(3, size / 7);
    ctx.strokeStyle = '#222';
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color || '#fff';
    ctx.fillText(str, x, y);
  }

  function drawButton(r, label, fill, dark, size) {
    ctx.fillStyle = dark; rr(r.x, r.y + 4, r.w, r.h, 12); ctx.fill();
    ctx.fillStyle = fill; rr(r.x, r.y, r.w, r.h, 12); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#222'; ctx.stroke();
    text(label, r.x + r.w / 2, r.y + r.h / 2 + size * 0.35, size, '#fff');
  }

  function drawCoin(x, y, r, sx) {
    ctx.fillStyle = '#ffd23f';
    ctx.strokeStyle = '#a87a00';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x, y, Math.max(1, r * sx), r, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (sx > 0.5) {
      ctx.strokeStyle = '#e0a800';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(x, y, r * sx * 0.55, r * 0.55, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.ellipse(x - r * sx * 0.3, y - r * 0.35, r * sx * 0.18, r * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function coinLabel(str, x, y, size, align, color) {
    ctx.font = 'bold ' + size + 'px ' + FONT;
    var w = ctx.measureText(str).width;
    var iw = size * 0.9 + 6;
    var total = w + iw;
    var sx = align === 'center' ? x - total / 2 : (align === 'right' ? x - total : x);
    drawCoin(sx + size * 0.45, y - size * 0.32, size * 0.45, 1);
    text(str, sx + iw, y, size, color || '#fff', 'left');
  }

  function drawCloud(c) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 18 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 20 * c.s, c.y - 8 * c.s, 22 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 44 * c.s, c.y, 17 * c.s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPipe(p) {
    var capH = 24, capExtra = 4;
    ctx.fillStyle = '#5ec23a';
    ctx.strokeStyle = '#2f6f1a';
    ctx.lineWidth = 2;
    ctx.fillRect(p.x, 0, PIPE_W, p.gapY);
    ctx.strokeRect(p.x, -2, PIPE_W, p.gapY + 2);
    ctx.fillRect(p.x - capExtra, p.gapY - capH, PIPE_W + capExtra * 2, capH);
    ctx.strokeRect(p.x - capExtra, p.gapY - capH, PIPE_W + capExtra * 2, capH);
    var by = p.gapY + p.gap;
    ctx.fillRect(p.x, by, PIPE_W, H - by);
    ctx.strokeRect(p.x, by, PIPE_W, H - by);
    ctx.fillRect(p.x - capExtra, by, PIPE_W + capExtra * 2, capH);
    ctx.strokeRect(p.x - capExtra, by, PIPE_W + capExtra * 2, capH);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(p.x + 8, 0, 8, p.gapY - capH);
    ctx.fillRect(p.x + 8, by + capH, 8, H - by);
  }

  function drawGround() {
    var y = H - GROUND_H;
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, y, W, GROUND_H);
    ctx.fillStyle = '#73bf2e';
    ctx.fillRect(0, y, W, 14);
    ctx.fillStyle = '#5a9e22';
    for (var x = groundX - 24; x < W + 24; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, y + 14); ctx.lineTo(x + 12, y); ctx.lineTo(x + 24, y + 14);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#c9b86a';
    ctx.fillRect(0, y + 14, W, 3);
  }

  // ---------- Птица (скины) ----------
  function skinColors(s, t) {
    if (s.rainbow) {
      var h = (t * 120) % 360;
      return { body: 'hsl(' + h + ',90%,60%)', wing: 'hsl(' + ((h + 50) % 360) + ',90%,50%)', line: s.line, beak: s.beak };
    }
    return s;
  }

  function drawBirdShape(skin, x, y, rot, s, t, dead) {
    var c = skinColors(skin, t);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.lineWidth = 2;
    ctx.strokeStyle = c.line;
    ctx.lineJoin = 'round';
    // тело
    ctx.fillStyle = c.body;
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // крыло
    var fa = dead ? 0 : Math.sin(t * 14) * 4;
    ctx.fillStyle = c.wing;
    ctx.beginPath(); ctx.ellipse(-4, 3 + fa * 0.3, 8, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // аксессуары
    if (skin.extra === 'band') {
      ctx.fillStyle = '#e63946';
      ctx.beginPath(); ctx.moveTo(1, -12); ctx.lineTo(11, -9); ctx.lineTo(10, -4); ctx.lineTo(0, -7); ctx.closePath(); ctx.fill(); ctx.stroke();
      var wag = Math.sin(t * 12) * 2;
      ctx.beginPath(); ctx.moveTo(1, -9); ctx.lineTo(-11, -13 + wag); ctx.lineTo(-9, -8 + wag); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (skin.extra === 'crown') {
      ctx.fillStyle = '#ffe36b';
      ctx.strokeStyle = '#8a6000';
      ctx.beginPath();
      ctx.moveTo(-5, -11); ctx.lineTo(-5, -21); ctx.lineTo(-1, -16); ctx.lineTo(3, -23);
      ctx.lineTo(7, -16); ctx.lineTo(11, -21); ctx.lineTo(11, -11); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = c.line;
    } else if (skin.extra === 'bow') {
      ctx.fillStyle = '#ff3d8b';
      ctx.beginPath(); ctx.moveTo(-5, -12); ctx.lineTo(-14, -19); ctx.lineTo(-14, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-5, -12); ctx.lineTo(4, -19); ctx.lineTo(4, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(-5, -12, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    // глаз
    if (dead) {
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(3, -9); ctx.lineTo(11, -1);
      ctx.moveTo(11, -9); ctx.lineTo(3, -1);
      ctx.stroke();
      ctx.strokeStyle = c.line;
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(7, -5, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(8.5, -5, 2, 0, Math.PI * 2); ctx.fill();
    }
    // клюв
    ctx.fillStyle = c.beak;
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(23, 3); ctx.lineTo(12, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // ---------- Зомби-птица ----------
  function drawZombie(e) {
    var s = e.r / 14;
    var w = Math.sin(gt * 16 + e.ph) * 4;
    var f = e.flash > 0;
    var body = f ? '#ffffff' : (e.tough ? '#7d62a6' : '#8fb08a');
    var wing = f ? '#dddddd' : (e.tough ? '#5b4580' : '#6f8c6a');
    var line = e.tough ? '#2b1a45' : '#2d3b2a';
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(-s, s); // смотрит влево
    ctx.lineWidth = 2;
    ctx.strokeStyle = line;
    ctx.lineJoin = 'round';
    // тело
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // рваное крыло
    ctx.fillStyle = wing;
    ctx.beginPath();
    ctx.moveTo(-10, 0); ctx.lineTo(-2, -2 + w * 0.3); ctx.lineTo(4, 4 + w * 0.3); ctx.lineTo(0, 8 + w * 0.5);
    ctx.lineTo(-4, 6 + w * 0.5); ctx.lineTo(-7, 11 + w * 0.5); ctx.lineTo(-11, 5 + w * 0.3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // швы
    ctx.beginPath();
    ctx.moveTo(-8, -8); ctx.lineTo(0, -6);
    ctx.moveTo(-6, -10); ctx.lineTo(-6, -5);
    ctx.moveTo(-2, -9); ctx.lineTo(-2, -4);
    ctx.stroke();
    // торчащая кость
    ctx.fillStyle = '#f4efe0';
    rr(-3, -21, 5, 10, 2); ctx.fill(); ctx.stroke();
    // шлем у крепких
    if (e.tough) {
      ctx.fillStyle = f ? '#ffffff' : '#aab3bd';
      ctx.beginPath(); ctx.ellipse(2, -7, 13, 8, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      if (e.hp === 1) {
        ctx.beginPath(); ctx.moveTo(-2, -15); ctx.lineTo(2, -11); ctx.lineTo(0, -8); ctx.lineTo(4, -6); ctx.stroke();
      }
    }
    // глаз
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(7, -4, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e01b1b';
    ctx.beginPath(); ctx.arc(8, -4, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(2, -10); ctx.lineTo(12, -7); ctx.stroke();
    ctx.lineWidth = 2;
    // открытый клюв
    ctx.fillStyle = '#b58a3c';
    ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(24, 0); ctx.lineTo(12, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, 4); ctx.lineTo(22, 8); ctx.lineTo(12, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawShot(s) {
    ctx.fillStyle = 'rgba(255,150,0,0.35)';
    ctx.beginPath(); ctx.ellipse(s.x - 10, s.y, 16, s.r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,170,0,0.5)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffcf33';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.4, 0, Math.PI * 2); ctx.fill();
  }

  function drawItem(c) {
    var sx = Math.max(0.25, Math.abs(Math.cos(gt * 4 + c.spin)));
    drawCoin(c.x, c.y, 10, sx);
  }

  function drawParts() {
    parts.forEach(function (p) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
  }

  function drawPops() {
    pops.forEach(function (p) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.4));
      text(p.text, p.x, p.y, p.size, p.color, 'center', 3);
    });
    ctx.globalAlpha = 1;
  }

  // ---------- Интерфейс ----------
  function drawAttackButton() {
    var x = ATK.x, y = ATK.y, r = ATK.r;
    var g = ctx.createRadialGradient(x - 8, y - 10, 4, x, y, r);
    g.addColorStop(0, '#ff9a4a');
    g.addColorStop(1, '#d6301f');
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(x, y + 3, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#4a1008'; ctx.stroke();
    // иконка: огненный шар
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(x + 4, y - 7, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x + 5, y - 8, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 20, y - 12); ctx.lineTo(x - 8, y - 9);
    ctx.moveTo(x - 20, y - 5); ctx.lineTo(x - 8, y - 5);
    ctx.stroke();
    ctx.lineCap = 'butt';
    text('АТАКА', x, y + 21, 12, '#fff', 'center', 3);
    // перезарядка
    if (attackCd > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (attackCd / ATTACK_CD));
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawSoundButton() {
    var r = BTN_SOUND, cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    rr(r.x, r.y, r.w, r.h, 8); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx - 9, cy - 3); ctx.lineTo(cx - 4, cy - 3); ctx.lineTo(cx + 2, cy - 8);
    ctx.lineTo(cx + 2, cy + 8); ctx.lineTo(cx - 4, cy + 3); ctx.lineTo(cx - 9, cy + 3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    if (save.muted) {
      ctx.beginPath(); ctx.moveTo(cx + 5, cy - 5); ctx.lineTo(cx + 12, cy + 5);
      ctx.moveTo(cx + 12, cy - 5); ctx.lineTo(cx + 5, cy + 5); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(cx + 3, cy, 6, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + 3, cy, 10, -0.9, 0.9); ctx.stroke();
    }
  }

  function drawBanner() {
    if (!banner) return;
    ctx.globalAlpha = Math.max(0, Math.min(1, banner.t / 0.5));
    text(banner.text, W / 2, 200, 38, '#ffd84a');
    text(banner.sub, W / 2, 232, 20, '#fff');
    ctx.globalAlpha = 1;
  }

  function drawHudPlaying() {
    text(String(score), W / 2, 92, 52);
    text('Ур. ' + level, 14, 34, 20, '#fff', 'left');
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    rr(14, 42, 86, 9, 4); ctx.fill();
    var frac = (score % LEVEL_STEP) / LEVEL_STEP;
    if (frac > 0) {
      ctx.fillStyle = '#ffd84a';
      rr(14, 42, Math.max(8, 86 * frac), 9, 4); ctx.fill();
    }
    coinLabel(String(save.coins), W - 14, 36, 22, 'right');
    drawAttackButton();
  }

  function drawReadyScreen() {
    coinLabel(String(save.coins), 14, 34, 22, 'left');
    drawSoundButton();
    text('Flappy Bird', W / 2, 150, 42, '#ffd84a');
    text('ЗОМБИ-РЕЖИМ', W / 2, 184, 20, '#b6f08a');
    text('Нажми, чтобы взлететь', W / 2, 345, 22);
    text('Кнопка АТАКА стреляет по зомби', W / 2, 375, 15, '#fff');
    drawButton(BTN_SHOP, 'Магазин', '#3d9bf0', '#1f5f9e', 22);
    text('Рекорд: ' + save.best + '  •  Макс. уровень: ' + save.bestLevel, W / 2, 520, 16, '#ffd84a');
  }

  function drawDeadScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ded895';
    ctx.strokeStyle = '#7a6a2a';
    ctx.lineWidth = 4;
    rr(40, 170, 280, 305, 14); ctx.fill(); ctx.stroke();
    text('Игра окончена', W / 2, 150, 34, '#ff6a4a');
    text('Счёт: ' + score, W / 2, 222, 30);
    if (newBest) text('НОВЫЙ РЕКОРД!', W / 2, 258, 22, '#ff6a4a');
    else text('Рекорд: ' + save.best, W / 2, 258, 22, '#ffd84a');
    text('Уровень: ' + level + '   Зомби: ' + runKills, W / 2, 294, 18);
    coinLabel('+' + runCoins + '  (всего ' + save.coins + ')', W / 2, 330, 20, 'center');
    if (performance.now() - deadTime > 400) {
      drawButton(BTN_PLAY, 'Играть', '#4cc24a', '#2a7d28', 24);
      drawButton(BTN_DSHOP, 'Магазин', '#3d9bf0', '#1f5f9e', 22);
    }
  }

  function drawShop() {
    ctx.fillStyle = 'rgba(20,20,60,0.45)';
    ctx.fillRect(0, 0, W, H);
    text('Магазин', W / 2, 52, 34, '#ffd84a');
    coinLabel(String(save.coins), W / 2, 92, 22, 'center');

    for (var i = 0; i < SKINS.length; i++) {
      var s = SKINS[i], r = cardRect(i);
      var owned = save.owned.indexOf(s.id) >= 0;
      var equipped = save.skin === s.id;
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      rr(r.x, r.y, r.w, r.h, 12); ctx.fill();
      ctx.lineWidth = equipped ? 4 : 2;
      ctx.strokeStyle = equipped ? '#2fb344' : '#555';
      ctx.stroke();
      drawBirdShape(s, r.x + r.w / 2, r.y + 32, 0, 1.25, gt, false);
      text(s.name, r.x + r.w / 2, r.y + 68, 15, '#fff', 'center', 3);
      var b = { x: r.x + 25, y: r.y + 76, w: 100, h: 22 };
      var fill, label;
      if (equipped) { fill = '#2fb344'; label = 'Выбрано'; }
      else if (owned) { fill = '#3d9bf0'; label = 'Выбрать'; }
      else { fill = save.coins >= s.price ? '#e8a600' : '#888'; label = null; }
      ctx.fillStyle = fill; rr(b.x, b.y, b.w, b.h, 8); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#222'; ctx.stroke();
      if (label) text(label, b.x + b.w / 2, b.y + 16, 14, '#fff', 'center', 3);
      else coinLabel(String(s.price), b.x + b.w / 2, b.y + 17, 15, 'center');
    }

    drawButton(BTN_BACK, 'Назад', '#e8573d', '#9e2f1f', 20);

    if (toast) {
      ctx.globalAlpha = Math.max(0, Math.min(1, toast.t / 0.4));
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      rr(30, 292, W - 60, 46, 12); ctx.fill();
      text(toast.text, W / 2, 322, 17, toast.color, 'center', 3);
      ctx.globalAlpha = 1;
    }
  }

  // ================= Главная отрисовка =================
  function draw() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#4ec0ca');
    g.addColorStop(1, '#bfe9ef');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    clouds.forEach(drawCloud);

    if (state === 'shop') {
      drawShop();
      ctx.restore();
      return;
    }

    pipes.forEach(drawPipe);
    items.forEach(drawItem);
    enemies.forEach(drawZombie);
    shots.forEach(drawShot);
    drawGround();
    drawBirdShape(getSkin(save.skin), BIRD_X, bird.y, bird.rot, 1, gt, state === 'dead');
    drawParts();

    if (state === 'playing') drawHudPlaying();
    else if (state === 'ready') drawReadyScreen();
    else if (state === 'dead') drawDeadScreen();

    drawPops();
    drawBanner();
    ctx.restore();
  }

  // ================= Цикл =================
  var lastT = performance.now();
  function loop(t) {
    var dt = Math.min((t - lastT) / 1000, 0.033);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
